# ─────────────────────────────────────────────────────────────────────────────
# BC Modas — configuração do Nginx
# Template: a variável ${DOMAIN} é substituída no start do container.
# ─────────────────────────────────────────────────────────────────────────────

upstream bcmodas_web {
    server web:8000;
}

# Bloco 1 — HTTP: desafio ACME + redirecionamento para HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name ${DOMAIN} *.${DOMAIN};

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Bloco 2 — HTTPS (captura o domínio raiz e subdomínios multi-tenant)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ${DOMAIN} *.${DOMAIN};

    ssl_certificate     /etc/nginx/certs/${DOMAIN}.crt;
    ssl_certificate_key /etc/nginx/certs/${DOMAIN}.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 25M;

    # Cabeçalhos de segurança
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    # Arquivos estáticos (collectstatic)
    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Mídia enviada por upload (produtos, logos)
    location /media/ {
        alias /app/media/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Aplicação Django (Gunicorn)
    location / {
        proxy_pass http://bcmodas_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }
}
