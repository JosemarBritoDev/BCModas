{% load i18n %}
<svg class="silk-sprite" aria-hidden="true" focusable="false">
    <symbol id="silk-raccoon" viewBox="0 0 64 64">
        <circle cx="17" cy="17" r="9" fill="#6b7280"/>
        <circle cx="47" cy="17" r="9" fill="#6b7280"/>
        <circle cx="17" cy="17" r="4.5" fill="#111827"/>
        <circle cx="47" cy="17" r="4.5" fill="#111827"/>
        <circle cx="32" cy="34" r="22" fill="#9ca3af"/>
        <path d="M10 30c6-6 16-6 22-2 6-4 16-4 22 2 3 3 3 9-1 12-5 4-13 3-17-1l-4-3-4 3c-4 4-12 5-17 1-4-3-4-9-1-12z" fill="#374151"/>
        <circle cx="23" cy="33" r="4.2" fill="#ffffff"/>
        <circle cx="41" cy="33" r="4.2" fill="#ffffff"/>
        <circle cx="23" cy="33" r="2.2" fill="#111827"/>
        <circle cx="41" cy="33" r="2.2" fill="#111827"/>
        <ellipse cx="32" cy="43" rx="10" ry="8" fill="#f9fafb"/>
        <path d="M32 40c2.2 0 4 1.4 4 3.2S34.2 47 32 47s-4-1.9-4-3.8S29.8 40 32 40z" fill="#111827"/>
        <path d="M32 47v3M32 50c-2.5 0-4-1.2-4.5-2.5M32 50c2.5 0 4-1.2 4.5-2.5"
              stroke="#111827" stroke-width="1.4" stroke-linecap="round" fill="none"/>
    </symbol>
</svg>

<div id="silk-widget" class="silk-widget" data-endpoint="{% url 'silk_help' %}">
    <button type="button" id="silk-toggle" class="silk-avatar-btn"
            aria-label="Abrir assistente Silk" aria-expanded="false">
        <svg class="silk-avatar" viewBox="0 0 64 64" aria-hidden="true">
            <use href="#silk-raccoon"></use>
        </svg>
    </button>

    <section id="silk-panel" class="silk-panel" hidden
             aria-label="Assistente Silk" role="dialog">
        <header class="silk-header">
            <svg class="silk-header-avatar" viewBox="0 0 64 64" aria-hidden="true">
                <use href="#silk-raccoon"></use>
            </svg>
            <div class="silk-header-text">
                <strong>Silk</strong>
                <small>Assistente do ERP</small>
            </div>
            <button type="button" id="silk-close" class="silk-close"
                    aria-label="Fechar assistente">&times;</button>
        </header>

        <div id="silk-messages" class="silk-messages" aria-live="polite"></div>

        <form id="silk-form" class="silk-form" autocomplete="off">
            {% csrf_token %}
            <input type="text" id="silk-input" class="silk-input"
                   placeholder="Pergunte sobre esta tela..." maxlength="500"
                   aria-label="Sua pergunta">
            <button type="submit" class="silk-send">Enviar</button>
        </form>
    </section>
</div>

<script>
(function () {
    const root = document.getElementById("silk-widget");
    if (!root) return;

    const toggle = document.getElementById("silk-toggle");
    const panel = document.getElementById("silk-panel");
    const closeBtn = document.getElementById("silk-close");
    const form = document.getElementById("silk-form");
    const input = document.getElementById("silk-input");
    const messages = document.getElementById("silk-messages");
    const endpoint = root.dataset.endpoint;

    function csrfToken() {
        const campo = root.querySelector("[name=csrfmiddlewaretoken]");
        return campo ? campo.value : "";
    }

    function addMessage(texto, autor, variante) {
        const div = document.createElement("div");
        div.className = "silk-msg silk-msg--" + (autor || "silk");
        if (variante) div.classList.add("silk-msg--" + variante);
        div.textContent = texto;
        messages.appendChild(div);
        messages.scrollTop = messages.scrollHeight;
        return div;
    }

    function setOpen(aberto) {
        root.classList.toggle("is-open", aberto);
        panel.hidden = !aberto;
        toggle.setAttribute("aria-expanded", aberto ? "true" : "false");
        if (aberto) input.focus();
    }

    toggle.addEventListener("click", function () {
        setOpen(!root.classList.contains("is-open"));
    });
    closeBtn.addEventListener("click", function () { setOpen(false); });

    // ── Modo Guiado (Offline) ────────────────────────────────────────────────
    const CHIPS_POR_MODULO = {
        financeiro: [
            "O que é esta tela?",
            "Como registrar contas?",
            "Regras de negócio",
        ],
        pedidos: [
            "O que é esta tela?",
            "Como criar um pedido?",
            "Regras de negócio",
        ],
        produtos: [
            "O que é esta tela?",
            "Como cadastrar?",
            "Regras de negócio",
        ],
        permissoes: [
            "O que é esta tela?",
            "Como definir acesso?",
            "Regras de negócio",
        ],
        geral: [
            "O que é esta tela?",
            "Como cadastrar?",
            "Regras de negócio",
        ],
    };

    function moduloDaRota() {
        const rota = window.location.pathname;
        if (rota.indexOf("/admin/financeiro/") === 0) return "financeiro";
        if (rota.indexOf("/admin/pedidos/") === 0 || rota.indexOf("/admin/clientes/") === 0) return "pedidos";
        if (rota.indexOf("/admin/produtos/") === 0) return "produtos";
        if (rota.indexOf("/admin/usuarios/") === 0 || rota.indexOf("/admin/tenants/") === 0 || rota.indexOf("/admin/auth/") === 0) return "permissoes";
        return "geral";
    }

    let quickContainer = null;

    function addQuickActions() {
        if (quickContainer) quickContainer.remove();

        const container = document.createElement("div");
        container.className = "silk-quick flex flex-wrap gap-2 px-3 pb-2";

        const perguntas = CHIPS_POR_MODULO[moduloDaRota()] || CHIPS_POR_MODULO.geral;
        perguntas.forEach(function (texto) {
            const botao = document.createElement("button");
            botao.type = "button";
            botao.className =
                "silk-chip inline-flex items-center rounded-full border border-gray-200 " +
                "dark:border-gray-700 bg-gray-50 dark:bg-gray-800 px-3 py-1.5 " +
                "text-xs text-gray-600 dark:text-gray-300 " +
                "transition hover:bg-gray-100 dark:hover:bg-gray-700 " +
                "focus:outline-none focus-visible:ring-2 focus-visible:ring-gray-400";
            botao.textContent = texto;
            botao.addEventListener("click", function () {
                enviarPergunta(texto);
            });
            container.appendChild(botao);
        });

        quickContainer = container;
        messages.appendChild(container);
        messages.scrollTop = messages.scrollHeight;
    }

    async function enviarPergunta(pergunta) {
        addMessage(pergunta, "user");
        if (quickContainer) {
            quickContainer.remove();
            quickContainer = null;
        }

        const carregando = addMessage("Silk está pensando...", "silk", "loading");

        try {
            const resposta = await fetch(endpoint, {
                method: "POST",
                headers: {
                    "X-CSRFToken": csrfToken(),
                    "X-Requested-With": "XMLHttpRequest",
                },
                body: new URLSearchParams({
                    pergunta: pergunta,
                    rota: window.location.pathname,
                }),
            });
            const dados = await resposta.json();
            carregando.remove();
            addMessage(
                dados.resposta || "Não consegui responder agora.",
                "silk",
                dados.bloqueado ? "blocked" : null
            );
        } catch (erro) {
            carregando.remove();
            addMessage("Ops! Não consegui falar com o servidor agora.", "silk");
        }
    }

    form.addEventListener("submit", function (evento) {
        evento.preventDefault();
        const pergunta = input.value.trim();
        if (!pergunta) return;
        input.value = "";
        enviarPergunta(pergunta);
    });

    addMessage(
        "Olá! Sou o Silk, o guaxinim do ERP. Pergunte o que precisar sobre esta tela.",
        "silk"
    );
    addQuickActions();
})();
</script>
